name: Carrusel semanal

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Tipo de carrusel: edu (educativo), mitos (datos y mitos), ahorro (ahorro y presupuesto), vida (vida cotidiana), euros (1.000 € hace N años) o calendario (agenda de la semana)"
        required: true
        default: edu
      index:
        description: "Opcional: número del carrusel en la cola (empezando en 0) para forzar uno concreto; en calendario, el lunes de la semana (AAAA-MM-DD)"
        required: false
      dry_run:
        description: "true = genera y sube las imágenes pero NO avisa a Make (no publica)"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write

concurrency:
  group: carrusel
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Elegir carrusel de la semana
        run: |
          if [ "${{ inputs.kind }}" = "euros" ]; then
            node build-euros.mjs item.json "${{ inputs.index }}"
          elif [ "${{ inputs.kind }}" = "calendario" ]; then
            node build-calendar.mjs item.json "${{ inputs.index }}"
          else
            node select-carousel.mjs "${{ inputs.kind }}" item.json "${{ inputs.index }}"
          fi

      - name: Generar diapositivas
        run: CAROUSEL_KIND="${{ inputs.kind }}" node render-carousel.mjs item.json out

      - name: Publicar imágenes en GitHub Pages
        id: publish
        run: |
          set -euo pipefail
          ID=$(jq -r .id item.json)
          DIR="${ID}-${GITHUB_RUN_ID}"
          git config --global user.name "reel-bot"
          git config --global user.email "reel-bot@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REMOTE" site
          else
            mkdir site && cd site && git init -q -b gh-pages && git remote add origin "$REMOTE" && cd ..
          fi
          mkdir -p "site/carruseles/${DIR}"
          cp out/*.jpg "site/carruseles/${DIR}/"
          touch site/.nojekyll
          # conservar solo las 20 últimas carpetas de carruseles
          ls -1dt site/carruseles/*/ | tail -n +21 | xargs -r rm -rf
          cd site
          git add -A
          git commit -q -m "Carrusel ${ID}"
          git push origin gh-pages
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/carruseles/${DIR}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Esperar a que las imágenes estén disponibles
        run: |
          BASE="${{ steps.publish.outputs.base }}"
          for f in out/*.jpg; do
            URL="${BASE}/$(basename "$f")"
            for i in $(seq 1 40); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -I "$URL" || true)
              echo "$URL intento $i: HTTP $CODE"
              [ "$CODE" = "200" ] && break
              [ "$i" = "40" ] && { echo "La URL no respondió a tiempo"; exit 1; }
              sleep 15
            done
          done

      - name: Avisar a Make
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          BASE="${{ steps.publish.outputs.base }}"
          jq -n --arg base "$BASE" --rawfile caption out/caption.txt --arg id "$(jq -r .id item.json)" \
            '{status:"carousel", id:$id, caption:$caption, images:[range(1; ($n|tonumber)+1) | ($base + "/" + (if . < 10 then "0" else "" end) + (. | tostring) + ".jpg")]}' --arg n "$(ls out/*.jpg | wc -l)" \
          | curl -sS --fail -X POST -H 'Content-Type: application/json' --data @- "$MAKE_WEBHOOK_URL"

      - name: Historia de aviso del carrusel
        if: ${{ always() && steps.publish.outcome == 'success' }}
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER: "17841438528056370"
          DRY: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          node render-teaser.mjs out/01.jpg "$(jq -r '.label // empty' item.json)" teaser.png
          NAME="aviso-$(jq -r .id item.json | tr -c 'A-Za-z0-9\n_-' '-')-${GITHUB_RUN_ID}.png"
          git config --global user.name "reel-bot"; git config --global user.email "reel-bot@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          rm -rf site2 && git clone --depth 1 --branch gh-pages "$REMOTE" site2
          mkdir -p site2/historias && cp teaser.png "site2/historias/$NAME" && touch site2/.nojekyll
          ls -1t site2/historias/* | tail -n +31 | xargs -r rm -f
          cd site2 && git add -A && git commit -q -m "Historia de aviso $NAME"
          for i in 1 2 3 4 5; do git push origin gh-pages && break || { git pull -q --rebase origin gh-pages; sleep 3; }; done
          cd ..
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/historias/$NAME"
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -I "$URL" || true); echo "intento $i: HTTP $CODE"
            [ "$CODE" = "200" ] && break; [ "$i" = "40" ] && { echo "::error::La imagen no respondió a tiempo"; exit 1; }; sleep 15
          done
          if [ "$DRY" = "true" ]; then echo "Prueba: historia generada, no publicada"; exit 0; fi
          if [ -z "$IG_TOKEN" ]; then echo "::error::Falta IG_ACCESS_TOKEN"; exit 1; fi
          # esperar a que Make haya publicado el carrusel
          sleep 150
          IG_TOKEN=$(printf %s "$IG_TOKEN" | tr -d "[:space:]\"'")
          case "$IG_TOKEN" in IG*) API="https://graph.instagram.com/v21.0";; *) API="https://graph.facebook.com/v21.0";; esac
          RES=$(curl -sS -X POST "$API/$IG_USER/media" --data-urlencode "media_type=STORIES" --data-urlencode "image_url=$URL" --data-urlencode "access_token=$IG_TOKEN")
          ID=$(echo "$RES" | jq -r '.id // empty')
          if [ -z "$ID" ]; then echo "::error::No se creó el contenedor: $(echo "$RES" | jq -c '.error // .' | sed "s/$IG_TOKEN/***/g")"; exit 1; fi
          for i in $(seq 1 30); do
            ST=$(curl -sS "$API/$ID?fields=status_code&access_token=$IG_TOKEN" | jq -r '.status_code // "?"'); echo "estado: $ST"
            [ "$ST" = "FINISHED" ] && break; [ "$ST" = "ERROR" ] && { echo "::error::Instagram rechazó la imagen"; exit 1; }; sleep 5
          done
          OUT=$(curl -sS -X POST "$API/$IG_USER/media_publish" --data-urlencode "creation_id=$ID" --data-urlencode "access_token=$IG_TOKEN")
          echo "$OUT" | jq -e '.id' >/dev/null || { echo "::error::Fallo al publicar: $(echo "$OUT" | jq -c '.error // .')"; exit 1; }
          echo "::notice::Historia de aviso publicada: $(echo "$OUT" | jq -r .id)"

      - name: Avisar a Make si falla
        if: ${{ failure() && inputs.dry_run != 'true' }}
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d '{"status":"error","run_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' "$MAKE_WEBHOOK_URL" || true
