name: Carrusel semanal

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Tipo de carrusel: edu (educativo), mitos (datos y mitos), ahorro (ahorro y presupuesto), vida (vida cotidiana), vivienda (hipoteca y alquiler), estafas (alerta estafa), renta (campaña de la Renta; solo en temporada), ipc o euribor (reacción el día del dato; solo si hay dato nuevo), tramites (trámites y ayudas), bienvenida (post de presentación, se publica una vez), euros (1.000 € hace N años), calendario (agenda de la semana) o semana (la semana en datos)"
        required: true
        default: edu
      index:
        description: "Opcional: número del carrusel en la cola (empezando en 0) para forzar uno concreto; en calendario, el lunes de la semana (AAAA-MM-DD)"
        required: false
      dry_run:
        description: "true = genera y sube las imágenes pero NO avisa a Make (no publica)"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write

concurrency:
  group: carrusel
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Elegir carrusel de la semana
        id: select
        run: |
          if [ "${{ inputs.kind }}" = "euros" ]; then
            node build-euros.mjs item.json "${{ inputs.index }}"
          elif [ "${{ inputs.kind }}" = "calendario" ]; then
            node build-calendar.mjs item.json "${{ inputs.index }}"
          elif [ "${{ inputs.kind }}" = "ipc" ] || [ "${{ inputs.kind }}" = "euribor" ]; then
            git config --global user.name "reel-bot"; git config --global user.email "reel-bot@users.noreply.github.com"
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" estado-tmp
            node build-reaccion.mjs "${{ inputs.kind }}" item.json estado-tmp/estado "${{ inputs.index }}"
          elif [ "${{ inputs.kind }}" = "semana" ]; then
            node build-semana.mjs item.json "${{ inputs.index }}"
          else
            node select-carousel.mjs "${{ inputs.kind }}" item.json "${{ inputs.index }}"
          fi

      - name: Generar diapositivas
        if: ${{ steps.select.outputs.skip != 'true' }}
        run: CAROUSEL_KIND="${{ inputs.kind }}" node render-carousel.mjs item.json out

      - name: Publicar imágenes en GitHub Pages
        if: ${{ steps.select.outputs.skip != 'true' }}
        id: publish
        run: |
          set -euo pipefail
          ID=$(jq -r .id item.json)
          DIR="${ID}-${GITHUB_RUN_ID}"
          git config --global user.name "reel-bot"
          git config --global user.email "reel-bot@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REMOTE" site
          else
            mkdir site && cd site && git init -q -b gh-pages && git remote add origin "$REMOTE" && cd ..
          fi
          mkdir -p "site/carruseles/${DIR}"
          cp out/*.jpg "site/carruseles/${DIR}/"
          touch site/.nojekyll
          # conservar solo las 20 últimas carpetas de carruseles
          ls -1dt site/carruseles/*/ | tail -n +21 | xargs -r rm -rf
          cd site
          git add -A
          git commit -q -m "Carrusel ${ID}"
          git push origin gh-pages
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/carruseles/${DIR}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Esperar a que las imágenes estén disponibles
        if: ${{ steps.select.outputs.skip != 'true' }}
        run: |
          BASE="${{ steps.publish.outputs.base }}"
          for f in out/*.jpg; do
            URL="${BASE}/$(basename "$f")"
            for i in $(seq 1 120); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -I "$URL" || true)
              echo "$URL intento $i: HTTP $CODE"
              [ "$CODE" = "200" ] && break
              [ "$i" = "120" ] && { echo "La URL no respondió a tiempo"; exit 1; }
              sleep 15
            done
          done

      - name: Vídeo para TikTok (se envía a Telegram al generarlo si es de los elegidos)
        if: ${{ steps.select.outputs.skip != 'true' && inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          sudo apt-get install -y ffmpeg >/dev/null 2>&1 || true
          ID=$(jq -r .id item.json)
          DAY=$(TZ=Europe/Madrid date +%F)
          NAME="tk-${DAY}-${ID}"
          # voz en off (si falla, el vídeo sale sin voz)
          pip install -q edge-tts 2>&1 | tail -1 || true
          node tools/carrusel-voz.mjs item.json voz || { echo "::warning::sin voz"; rm -rf voz; }
          bash tools/carrusel-video.sh out "${NAME}.mp4" voz || bash tools/carrusel-video.sh out "${NAME}.mp4"
          cd site && mkdir -p tiktok-carruseles
          cp "../${NAME}.mp4" tiktok-carruseles/ && cp ../out/caption.txt "tiktok-carruseles/${NAME}.txt"
          cd ..
          # Telegram al momento solo para los carruseles elegidos
          if echo "$ID" | grep -qE '^(mitos|estafas|vivienda|semana)'; then ONLY="$NAME" node tools/telegram-tiktok.mjs site || echo "::warning::No se pudo enviar a Telegram"; fi
          cd site
          ls -1t tiktok-carruseles/*.mp4 | tail -n +15 | while read f; do rm -f "$f" "${f%.mp4}.txt"; done
          git add -A && git commit -q -m "Vídeo TikTok ${ID}" || exit 0
          for i in 1 2 3 4 5; do git push origin gh-pages && break || { git pull -q --rebase origin gh-pages; sleep 3; }; done

      - name: Avisar a Make
        if: ${{ inputs.dry_run != 'true' && steps.select.outputs.skip != 'true' }}
        run: |
          N=$(ls out/*.jpg | wc -l)
          if [ "$N" != "7" ]; then echo "::error::El carrusel tiene $N diapositivas y Instagram necesita exactamente 7: no se publica"; exit 1; fi
          BASE="${{ steps.publish.outputs.base }}"
          jq -n --arg base "$BASE" --rawfile caption out/caption.txt --arg id "$(jq -r .id item.json)" \
            '{status:"carousel", id:$id, caption:$caption, images:[range(1; ($n|tonumber)+1) | ($base + "/" + (if . < 10 then "0" else "" end) + (. | tostring) + ".jpg")]}' --arg n "$(ls out/*.jpg | wc -l)" \
          | curl -sS --fail -X POST -H 'Content-Type: application/json' --data @- "$MAKE_WEBHOOK_URL"

      - name: Marcar reacción como publicada
        if: ${{ inputs.dry_run != 'true' && steps.select.outputs.skip != 'true' && (inputs.kind == 'ipc' || inputs.kind == 'euribor') }}
        run: |
          cd site && mkdir -p estado && date -u +%FT%TZ > "estado/reaccion-$(cat ../reaccion.key).txt"
          git add -A && git commit -q -m "Reacción publicada $(cat ../reaccion.key)"
          for i in 1 2 3 4 5; do git push origin gh-pages && break || { git pull -q --rebase origin gh-pages; sleep 3; }; done

      - name: Historia de aviso del carrusel
        if: ${{ always() && steps.publish.outcome == 'success' }}
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER: "17841438528056370"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIND: carrusel
          DRY: ${{ inputs.dry_run }}
        run: |
          export COVER=out/01.jpg
          export LABEL="$(cat out/series.txt 2>/dev/null || jq -r '.label // empty' item.json)"
          bash tools/announce-story.sh

      - name: Avisar a Make si falla
        if: ${{ failure() && inputs.dry_run != 'true' }}
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d '{"status":"error","run_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' "$MAKE_WEBHOOK_URL" || true
