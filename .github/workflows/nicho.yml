name: Cuentas del nicho
# Make lee las últimas publicaciones de las cuentas afines (módulo oficial de Instagram) y las envía aquí.
# Se guardan en gh-pages (estado/nicho.json) para preparar los comentarios.
on:
  workflow_dispatch:
    inputs:
      data_b64:
        description: "JSON en base64 con las publicaciones leídas por Make"
        required: true
permissions:
  contents: write
jobs:
  guardar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guardar en gh-pages
        env:
          DATA: ${{ inputs.data_b64 }}
        run: |
          set -euo pipefail
          printf '%s' "$DATA" | base64 -d > nicho.json
          jq -e 'length >= 0' nicho.json >/dev/null
          git config --global user.name "reel-bot"; git config --global user.email "reel-bot@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch gh-pages "$REMOTE" site
          mkdir -p site/estado && cp nicho.json site/estado/nicho.json
          cd site && git add -A && git commit -q -m "Cuentas del nicho" && git push origin gh-pages
