name: Probar fuentes de datos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probar
        run: |
          curl -sS -m 25 -A "Mozilla/5.0" "https://apidatos.ree.es/es/datos/mercados/precios-mercados-tiempo-real?start_date=2026-10-17T00:00&end_date=2026-10-19T23:59&time_trunc=hour" -o ree.json
          curl -sS -m 25 -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/GC%3DF?range=1mo&interval=1d" -o gc.json
          curl -sS -m 25 -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/BZ%3DF?range=1mo&interval=1d" -o bz.json
          curl -sS -m 25 -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?range=1mo&interval=1d" -o spx.json
          curl -sS -m 25 -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/EURUSD%3DX?range=5d&interval=1d" -o eur.json
          git config --global user.name reel-bot; git config --global user.email reel-bot@users.noreply.github.com
          git clone -q --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site
          mkdir -p site/probe && cp ree.json gc.json bz.json spx.json eur.json site/probe/
          cd site && git add -A && git commit -q -m "probe2" && git push -q origin gh-pages
