name: Comprobar euros
on:
  workflow_dispatch:
    inputs:
      only:
        required: false
        default: '0,1,14'
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          timeout 400 node build-euros.mjs --check '${{ inputs.only }}' | tee out.txt || true
          while IFS= read -r l; do echo "::notice::$l"; done < out.txt
