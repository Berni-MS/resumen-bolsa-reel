name: Reel diario

on:
  workflow_dispatch:
    inputs:
      record_b64:
        description: Registro de RESUMEN_BOLSA (JSON en base64), lo envía Make
        required: true

permissions:
  contents: write

concurrency:
  group: reel
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Preparar datos
        env:
          RECORD_B64: ${{ inputs.record_b64 }}
        run: |
          printf '%s' "$RECORD_B64" | base64 -d > record.json
          node prepare.mjs record.json data.json

      - name: Generar pantallas y vídeo
        run: node render.mjs data.json out

      - name: Publicar vídeo en GitHub Pages
        id: publish
        run: |
          set -euo pipefail
          DATE=$(jq -r .date record.json)
          NAME="${DATE}-${GITHUB_RUN_ID}.mp4"
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REMOTE" site
          else
            mkdir site && cd site && git init -q -b gh-pages && git remote add origin "$REMOTE" && cd ..
          fi
          mkdir -p site/reels
          cp out/reel.mp4 "site/reels/${NAME}"
          cp out/0*.png site/reels/ 2>/dev/null || true
          touch site/.nojekyll
          # conservar solo los 14 últimos vídeos
          ls -1t site/reels/*.mp4 | tail -n +15 | xargs -r rm -f
          rm -f site/reels/0*.png
          cd site
          git add -A
          git commit -q -m "Reel ${DATE}" || true
          git push origin gh-pages
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reels/${NAME}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Esperar a que la URL esté disponible
        run: |
          URL="${{ steps.publish.outputs.url }}"
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -I "$URL" || true)
            echo "intento $i: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 15
          done
          echo "La URL no respondió a tiempo (¿está activado GitHub Pages?)"; exit 1

      - name: Avisar a Make
        run: |
          jq -n --arg url "${{ steps.publish.outputs.url }}" --rawfile caption out/caption.txt --arg date "$(jq -r .date record.json)" \
            '{status:"ok", video_url:$url, caption:$caption, date:$date}' \
          | curl -sS --fail -X POST -H 'Content-Type: application/json' --data @- "$MAKE_WEBHOOK_URL"

      - name: Avisar a Make si falla
        if: failure()
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d '{"status":"error","run_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' "$MAKE_WEBHOOK_URL" || true
