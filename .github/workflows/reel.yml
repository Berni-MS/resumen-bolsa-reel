name: Reel diario

on:
  push:
    branches: [test-reel]   # prueba manual: usa record.sample.json
  workflow_dispatch:
    inputs:
      record_b64:
        description: Registro de RESUMEN_BOLSA (JSON en base64), lo envía Make
        required: false
      voz:
        description: "false = sin voz en off (por defecto, con voz: edge-tts, Álvaro)"
        required: false
        default: "true"
      extras:
        description: "true = en la prueba, envía además el guion de la voz y el aviso del IBEX"
        required: false
        default: "false"
      prueba:
        description: "true = genera el vídeo con datos de ejemplo y lo envía solo a Telegram; NO publica nada"
        required: false
        default: "false"

permissions:
  contents: write
  pages: write

concurrency:
  group: reel
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Preparar datos
        env:
          RECORD_B64: ${{ inputs.record_b64 }}
        run: |
          set -o pipefail
          if [ -n "$RECORD_B64" ]; then
            printf '%s' "$RECORD_B64" | base64 -d > record.json
          else
            cp record.sample.json record.json
          fi
          node prepare.mjs record.json data.json 2>&1 | tee prepare.log

      - name: Instalar voz (edge-tts)
        continue-on-error: true
        run: pip install -q edge-tts fonttools brotli 2>&1 | tail -1

      - name: Generar pantallas y vídeo
        env:
          VOZ: ${{ inputs.voz != 'false' }}
        run: node render.mjs data.json out

      - name: Enviar prueba a Telegram (sin publicar)
        if: ${{ inputs.prueba == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          grep -E "IBEX|AVISO" prepare.log | head -8 > aviso.txt || true
          [ "${{ inputs.extras }}" = "true" ] && [ -s aviso.txt ] && curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -F "chat_id=${TELEGRAM_CHAT_ID}" -F "text=Registro de la prueba: $(cat aviso.txt)" >/dev/null || true
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/reel.mp4 | cut -d. -f1)
          curl -sS --fail -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" -F "chat_id=${TELEGRAM_CHAT_ID}" -F "video=@out/reel.mp4" -F "supports_streaming=true" -F "caption=PRUEBA (no se ha publicado): reel del resumen de bolsa${{ inputs.voz != 'false' && ' CON VOZ EN OFF' || '' }}, ${DUR} s." >/dev/null && echo "Prueba enviada"
          if [ "${{ inputs.extras }}" = "true" ] && [ -s out/voz.txt ]; then
            { printf 'Guion de la voz:\n\n'; cat out/voz.txt; } > voz-msg.txt
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -F "chat_id=${TELEGRAM_CHAT_ID}" -F "text=<voz-msg.txt" >/dev/null || true
          else echo "Sin guion de voz (el vídeo salió sin voz)"; fi

      - name: Guardar el registro de la prueba
        if: ${{ always() && inputs.prueba == 'true' }}
        continue-on-error: true
        run: |
          git config --global user.name "reel-bot"; git config --global user.email "reel-bot@users.noreply.github.com"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site-log
          mkdir -p site-log/estado && { date -u +%FT%TZ; cat prepare.log 2>/dev/null; } > site-log/estado/prueba-reel.txt
          cd site-log && git add -A && git commit -q -m "Registro de la prueba del reel" && git push origin gh-pages

      - name: Publicar vídeo en GitHub Pages
        if: ${{ inputs.prueba != 'true' }}
        id: publish
        run: |
          set -euo pipefail
          DATE=$(jq -r .date record.json)
          NAME="${DATE}-${GITHUB_RUN_ID}.mp4"
          git config --global user.name "reel-bot"
          git config --global user.email "reel-bot@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REMOTE" site
          else
            mkdir site && cd site && git init -q -b gh-pages && git remote add origin "$REMOTE" && cd ..
          fi
          mkdir -p site/reels
          cp out/reel.mp4 "site/reels/${NAME}"
          cp out/0*.png site/reels/ 2>/dev/null || true
          cp out/caption.txt "site/reels/${NAME%.mp4}.txt" 2>/dev/null || true
          touch site/.nojekyll
          # conservar solo los 14 últimos vídeos
          ls -1t site/reels/*.mp4 | tail -n +15 | xargs -r rm -f
          rm -f site/reels/0*.png
          for f in site/reels/*.txt; do [ -f "${f%.txt}.mp4" ] || rm -f "$f"; done
          cd site
          git add -A
          git commit -q -m "Reel ${DATE}"
          git push origin gh-pages
          # un push hecho con GITHUB_TOKEN no lanza solo la publicación de Pages: se pide expresamente
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reels/${NAME}"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Esperar a que la URL esté disponible
        if: ${{ inputs.prueba != 'true' }}
        run: |
          URL="${{ steps.publish.outputs.url }}"
          for i in $(seq 1 120); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -I "$URL" || true)
            echo "intento $i: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 15
          done
          echo "La URL no respondió a tiempo (¿está activado GitHub Pages?)"; exit 1

      - name: Avisar a Make
        if: ${{ inputs.prueba != 'true' }}
        run: |
          jq -n --arg url "${{ steps.publish.outputs.url }}" --rawfile caption out/caption.txt --arg date "$(jq -r .date record.json)" \
            '{status:"ok", video_url:$url, caption:$caption, date:$date}' \
          | curl -sS --fail -X POST -H 'Content-Type: application/json' --data @- "$MAKE_WEBHOOK_URL"

      - name: Historia de aviso del reel
        if: ${{ always() && steps.publish.outcome == 'success' }}
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER: "17841438528056370"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KIND: reel
        run: |
          ffmpeg -y -loglevel error -i out/reel.mp4 -frames:v 1 cover.jpg
          export COVER=cover.jpg
          export LABEL="Resumen Bolsa"
          bash tools/announce-story.sh

      - name: Avisar a Make si falla
        if: ${{ failure() && inputs.prueba != 'true' }}
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d '{"status":"error","run_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' "$MAKE_WEBHOOK_URL" || true
