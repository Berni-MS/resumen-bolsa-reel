name: Historia de novedades (carburantes, Euríbor, IPC)
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "carburantes (semanal), euribor (mensual) o ipc (mensual)"
        required: true
        default: carburantes
      dry_run:
        description: "true = genera la imagen pero NO publica la historia"
        required: false
        default: "false"
      force:
        description: "true = publica aunque ese dato ya se hubiera publicado"
        required: false
        default: "false"
permissions:
  contents: write
  pages: write
concurrency:
  group: novedades-${{ inputs.kind }}
  cancel-in-progress: false
jobs:
  historia:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clonar estado (gh-pages)
        run: |
          git config --global user.name "reel-bot"; git config --global user.email "reel-bot@users.noreply.github.com"
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site
          mkdir -p site/estado site/historias
      - name: Obtener datos
        id: data
        run: node build-novedades.mjs "${{ inputs.kind }}" datos.json site/estado "${{ inputs.force }}"
      - name: Instalar dependencias
        if: ${{ steps.data.outputs.skip == 'false' }}
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Generar imagen
        if: ${{ steps.data.outputs.skip == 'false' }}
        run: node render-datos.mjs datos.json story.png
      - name: Crear vídeo de la historia
        continue-on-error: true
        if: ${{ steps.data.outputs.skip == 'false' }}
        run: |
          exec 2>&1
          which ffmpeg >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; } || echo "::warning::No se pudo instalar ffmpeg"
          DUR=$(cat story.dur 2>/dev/null || echo 12)
          ffmpeg -y -loop 1 -framerate 30 -t "$DUR" -i story.png -stream_loop -1 -t "$DUR" -i "$(node tools/musica.mjs neutral 2>/dev/null || echo assets/music.mp3)" -c:v libx264 -preset veryfast -tune stillimage -pix_fmt yuv420p -r 30 -af "volume=0.55,afade=t=in:d=0.5,afade=t=out:st=$(awk -v d="$DUR" 'BEGIN{print d-1.5}'):d=1.5" -c:a aac -ar 44100 -ac 2 -b:a 128k -shortest -movflags +faststart story.mp4 > ffmpeg.log 2>&1 || { echo "::warning::ffmpeg falló: $(tail -c 600 ffmpeg.log | tr '\n' ' ')"; exit 1; }
          echo "Vídeo de ${DUR} s creado"
      - name: Publicar imagen en GitHub Pages
        id: publish
        if: ${{ steps.data.outputs.skip == 'false' }}
        run: |
          set -euo pipefail
          NAME="${{ steps.data.outputs.key }}-${GITHUB_RUN_ID}.png"
          cp story.png "site/historias/$NAME" && { [ -f story.mp4 ] && cp story.mp4 "site/historias/${NAME%.png}.mp4" || true; } && touch site/.nojekyll
          ls -1t site/historias/* | tail -n +81 | xargs -r rm -f
          cd site && git add -A && git commit -q -m "Historia $NAME" || true
          for i in 1 2 3 4 5; do git push origin gh-pages && break || { git pull -q --rebase origin gh-pages; sleep 3; }; done
          cd ..
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/historias/$NAME"
          for i in $(seq 1 120); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -I "$URL" || true); echo "intento $i: HTTP $CODE"
            [ "$CODE" = "200" ] && break; [ "$i" = "120" ] && { echo "::error::La imagen no respondió a tiempo"; exit 1; }; sleep 15
          done
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -f "$GITHUB_WORKSPACE/story.mp4" ]; then
            VURL="${URL%.png}.mp4"
            for i in $(seq 1 120); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -I "$VURL" || true); echo "vídeo intento $i: HTTP $CODE"
              [ "$CODE" = "200" ] && { echo "video=$VURL" >> "$GITHUB_OUTPUT"; break; }; sleep 15
            done
          fi
      - name: Publicar historia en Instagram
        id: ig
        if: ${{ inputs.dry_run != 'true' && steps.publish.outputs.url != '' }}
        env:
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER: "17841438528056370"
          IMAGE_URL: ${{ steps.publish.outputs.url }}
          VIDEO_URL: ${{ steps.publish.outputs.video }}
        run: bash tools/ig-story.sh
      - name: Marcar como publicado
        if: ${{ steps.ig.outcome == 'success' }}
        run: |
          cd site && date -u +%FT%TZ > "estado/${{ steps.data.outputs.key }}.txt"
          git add -A && git commit -q -m "Publicado ${{ steps.data.outputs.key }}"
          for i in 1 2 3 4 5; do git push origin gh-pages && break || { git pull -q --rebase origin gh-pages; sleep 3; }; done
