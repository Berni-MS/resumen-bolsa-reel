name: Historia calculadora de la semana
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Opcional: fecha AAAA-MM-DD para probar (por defecto, hoy en Madrid)"
        required: false
      dry_run:
        description: "true = genera la imagen pero NO publica la historia"
        required: false
        default: "false"
permissions:
  contents: write
  pages: write
concurrency:
  group: calculadora
  cancel-in-progress: false
jobs:
  historia:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Calculadora de la semana
        run: node build-calculadora.mjs day.json "${{ inputs.date }}"
      - name: Generar imagen
        run: node render-datos.mjs day.json story.png
      - name: Publicar imagen en GitHub Pages
        id: publish
        run: |
          [ -f story.png ] || exit 0
          set -euo pipefail
          NAME="calculadora-$(jq -r .date day.json)-${GITHUB_RUN_ID}.png"
          git config --global user.name "reel-bot"; git config --global user.email "reel-bot@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch gh-pages "$REMOTE" site
          mkdir -p site/historias && cp story.png "site/historias/$NAME" && touch site/.nojekyll
          ls -1t site/historias/* | tail -n +31 | xargs -r rm -f
          cd site && git add -A && git commit -q -m "Historia $NAME"
          for i in 1 2 3 4 5; do git push origin gh-pages && break || { git pull -q --rebase origin gh-pages; sleep 3; }; done
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/historias/$NAME"
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -I "$URL" || true); echo "intento $i: HTTP $CODE"
            [ "$CODE" = "200" ] && break; [ "$i" = "40" ] && { echo "::error::La imagen no respondió a tiempo"; exit 1; }; sleep 15
          done
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Publicar historia en Instagram
        if: ${{ inputs.dry_run != 'true' && steps.publish.outputs.url != '' }}
        env:
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER: "17841438528056370"
          IMAGE_URL: ${{ steps.publish.outputs.url }}
        run: |
          if [ -z "$IG_TOKEN" ]; then echo "::error::Falta IG_ACCESS_TOKEN"; exit 1; fi
          IG_TOKEN=$(printf %s "$IG_TOKEN" | tr -d "[:space:]\"'")
          case "$IG_TOKEN" in IG*) API="https://graph.instagram.com/v21.0";; *) API="https://graph.facebook.com/v21.0";; esac
          RES=$(curl -sS -X POST "$API/$IG_USER/media" --data-urlencode "media_type=STORIES" --data-urlencode "image_url=$IMAGE_URL" --data-urlencode "access_token=$IG_TOKEN")
          ID=$(echo "$RES" | jq -r '.id // empty')
          if [ -z "$ID" ]; then echo "::error::No se creó el contenedor: $(echo "$RES" | jq -c '.error // .' | sed "s/$IG_TOKEN/***/g")"; exit 1; fi
          for i in $(seq 1 30); do
            ST=$(curl -sS "$API/$ID?fields=status_code&access_token=$IG_TOKEN" | jq -r '.status_code // "?"'); echo "estado: $ST"
            [ "$ST" = "FINISHED" ] && break; [ "$ST" = "ERROR" ] && { echo "::error::Instagram rechazó la imagen"; exit 1; }; sleep 5
          done
          OUT=$(curl -sS -X POST "$API/$IG_USER/media_publish" --data-urlencode "creation_id=$ID" --data-urlencode "access_token=$IG_TOKEN")
          echo "$OUT" | jq -e '.id' >/dev/null || { echo "::error::Fallo al publicar: $(echo "$OUT" | jq -c '.error // .')"; exit 1; }
          echo "::notice::Historia publicada: $(echo "$OUT" | jq -r .id)"
