name: probe-video
on:
  workflow_dispatch:
    inputs:
      video_url:
        required: true
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: Probar vídeo sin publicar
        env:
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER: "17841438528056370"
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          IG_TOKEN=$(printf %s "$IG_TOKEN" | tr -d "[:space:]\"'")
          case "$IG_TOKEN" in IG*) API="https://graph.instagram.com/v21.0";; *) API="https://graph.facebook.com/v21.0";; esac
          echo "::warning::HEAD: $(curl -sI "$VIDEO_URL" | tr '\r\n' ' ')"
          RES=$(curl -sS -X POST "$API/$IG_USER/media" --data-urlencode "media_type=STORIES" --data-urlencode "video_url=$VIDEO_URL" --data-urlencode "access_token=$IG_TOKEN")
          echo "::warning::crear: $(echo "$RES" | sed "s/$IG_TOKEN/***/g")"
          ID=$(echo "$RES" | jq -r '.id // empty'); [ -z "$ID" ] && exit 0
          for i in $(seq 1 24); do
            ST=$(curl -sS "$API/$ID?fields=status_code,status&access_token=$IG_TOKEN" | sed "s/$IG_TOKEN/***/g"); echo "estado: $ST"
            case "$ST" in *FINISHED*|*ERROR*) break;; esac; sleep 5
          done
          echo "::warning::final: $ST"
