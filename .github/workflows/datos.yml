name: Historia de datos (luz, mercados y palabra del día)
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "luz (precio de la luz de mañana), dinero (Los mercados hoy) o palabra (Palabra del día)"
        required: true
        default: luz
      date:
        description: "Opcional: fecha AAAA-MM-DD para probar (por defecto, hoy en Madrid)"
        required: false
      dry_run:
        description: "true = genera la imagen pero NO publica la historia"
        required: false
        default: "false"
permissions:
  contents: write
  pages: write
concurrency:
  group: datos
  cancel-in-progress: false
jobs:
  historia:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Obtener datos
        run: |
          set -o pipefail
          node build-datos.mjs "${{ inputs.kind }}" datos.json "${{ inputs.date }}" 2>&1 | tee run.log
      - name: Generar imagen
        run: |
          set -o pipefail
          node render-datos.mjs datos.json story.png 2>&1 | tee -a run.log
      - name: Crear vídeo de la historia
        continue-on-error: true
        run: |
          exec 2>&1
          which ffmpeg >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; } || echo "::warning::No se pudo instalar ffmpeg"
          DUR=$(cat story.dur 2>/dev/null || echo 12)
          ffmpeg -y -loop 1 -framerate 30 -t "$DUR" -i story.png -stream_loop -1 -t "$DUR" -i assets/music.mp3 -c:v libx264 -preset veryfast -tune stillimage -pix_fmt yuv420p -r 30 -af "volume=0.55,afade=t=in:d=0.5,afade=t=out:st=$(awk -v d="$DUR" 'BEGIN{print d-1.5}'):d=1.5" -c:a aac -ar 44100 -ac 2 -b:a 128k -shortest -movflags +faststart story.mp4 > ffmpeg.log 2>&1 || { echo "::warning::ffmpeg falló: $(tail -c 600 ffmpeg.log | tr '\n' ' ')"; exit 1; }
          echo "Vídeo de ${DUR} s creado"
      - name: Publicar imagen en GitHub Pages
        id: publish
        run: |
          [ -f story.png ] || exit 0
          set -euo pipefail
          NAME="${{ inputs.kind }}-$(jq -r .date datos.json)-${GITHUB_RUN_ID}.png"
          git config --global user.name "reel-bot"; git config --global user.email "reel-bot@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch gh-pages "$REMOTE" site
          mkdir -p site/historias && cp story.png "site/historias/$NAME" && { [ -f story.mp4 ] && cp story.mp4 "site/historias/${NAME%.png}.mp4" || true; } && touch site/.nojekyll
          ls -1t site/historias/* | tail -n +61 | xargs -r rm -f
          cd site && git add -A && git commit -q -m "Historia $NAME"
          for i in 1 2 3 4 5; do git push origin gh-pages && break || { git pull -q --rebase origin gh-pages; sleep 3; }; done
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/historias/$NAME"
          for i in $(seq 1 120); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -I "$URL" || true); echo "intento $i: HTTP $CODE"
            [ "$CODE" = "200" ] && break; [ "$i" = "120" ] && { echo "::error::La imagen no respondió a tiempo"; exit 1; }; sleep 15
          done
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -f "$GITHUB_WORKSPACE/story.mp4" ]; then
            VURL="${URL%.png}.mp4"
            for i in $(seq 1 120); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -I "$VURL" || true); echo "vídeo intento $i: HTTP $CODE"
              [ "$CODE" = "200" ] && { echo "video=$VURL" >> "$GITHUB_OUTPUT"; break; }; sleep 15
            done
          fi
      - name: Publicar historia en Instagram
        if: ${{ inputs.dry_run != 'true' && steps.publish.outputs.url != '' }}
        env:
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER: "17841438528056370"
          IMAGE_URL: ${{ steps.publish.outputs.url }}
          VIDEO_URL: ${{ steps.publish.outputs.video }}
        run: bash tools/ig-story.sh
      - name: Guardar el motivo del fallo (si lo hay)
        if: ${{ failure() }}
        run: |
          [ -f run.log ] || echo "Fallo antes de generar la historia (instalación o preparación)" > run.log
          git config --global user.name "reel-bot"; git config --global user.email "reel-bot@users.noreply.github.com"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch gh-pages "$REMOTE" site-fallo
          mkdir -p site-fallo/estado && { echo "Fallo de ${{ inputs.kind }} · $(date -u +%FT%TZ) · ejecución ${GITHUB_RUN_ID}"; tail -n 60 run.log; } > "site-fallo/estado/fallo-datos-${{ inputs.kind }}.txt"
          cd site-fallo && git add -A && git commit -q -m "Fallo de la historia ${{ inputs.kind }}" && git push origin gh-pages || true
