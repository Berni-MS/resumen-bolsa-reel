name: Probe IG permisos
on:
  workflow_dispatch:
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER: "17841438528056370"
        run: |
          T=$(printf %s "$IG_TOKEN" | tr -d "[:space:]\"'")
          case "$T" in IG*) API="https://graph.instagram.com/v21.0"; echo "::notice::Tipo de token: Instagram Login";; *) API="https://graph.facebook.com/v21.0"; echo "::notice::Tipo de token: Facebook Login";; esac
          M=$(curl -sS "$API/$IG_USER/media?fields=id,comments_count&limit=5&access_token=$T")
          ID=$(echo "$M" | jq -r '[.data[]?|select(.comments_count>0)][0].id // (.data[0].id)')
          echo "::notice::media usado: $ID"
          C=$(curl -sS "$API/$ID/comments?fields=id,text,username&access_token=$T")
          echo "::notice::comentarios: $(echo "$C" | jq -c '.data // .error' | cut -c1-300)"
          C=$(curl -sS "$API/$IG_USER/subscribed_apps?access_token=$T")
          echo "::notice::subscribed_apps: $(echo "$C" | jq -c '.' | cut -c1-300)"
          if [ "${T:0:2}" != "IG" ]; then P=$(curl -sS "$API/me/permissions?access_token=$T"); echo "::notice::permisos: $(echo "$P" | jq -c '[.data[]?|select(.status=="granted")|.permission]' | cut -c1-600)"; fi
